services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DIRECT_DATABASE_URL}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - PORT=${PORT}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local S3 + SES for fully-local dev (LOCAL=true). Not used by the AWS
  # deploy path. Start it alongside Postgres:
  #   docker compose up -d postgres localstack
  # The init script (scripts/localstack-init.sh) creates the bucket, sets CORS,
  # and verifies the SES sender on every startup.
  localstack:
    image: localstack/localstack:4
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,ses
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-angelman-videos-local}
      - SES_FROM_EMAIL=${SES_FROM_EMAIL:-no-reply@local.dev}
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost:5173}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  localstack_data:
