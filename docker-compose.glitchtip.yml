# Self-hosted GlitchTip — error telemetry + feedback sink for the Asclepion app.
# This is a SEPARATE deployment from the app (its own DB/redis/volumes/domain).
# Both the `next` and `dev` Asclepion deployments point their *_DSN at this one
# instance; create one GlitchTip PROJECT per environment (asclepion-next,
# asclepion-dev) in the GlitchTip UI and copy each DSN into the app's telemetry vars.
#
# ── Deploy on Coolify ────────────────────────────────────────────────────────
#   Add as a new Coolify "Docker Compose" resource pointing at this file.
#   Set the `gt-web` service's domain to https://glitchtip.<domain>, target port 8000
#   (Coolify's proxy connects to the exposed port; do NOT publish host ports here).
#   Set the required env below in the Coolify resource. GLITCHTIP_DOMAIN MUST equal
#   the public URL you assigned (used for CSRF/allowed-hosts and email links).
#
# ── Run locally ──────────────────────────────────────────────────────────────
#   cp .env.glitchtip.example .env.glitchtip   # then fill in the three secrets
#   docker compose -p glitchtip --env-file .env.glitchtip \
#     -f docker-compose.glitchtip.yml -f docker-compose.glitchtip.local.yml up -d
#   Open http://localhost:8000  (open registration is on in the local override —
#   create the first account, make an org + project, copy its DSN).
#
# ── Required env (Coolify resource, or .env.glitchtip locally) ────────────────
#   GLITCHTIP_SECRET_KEY   long random string — `openssl rand -base64 50`
#   GLITCHTIP_DB_PASSWORD  password for GlitchTip's OWN Postgres
#   GLITCHTIP_DOMAIN       full external URL, e.g. https://glitchtip.cs4535.cloud
#
# NOTE: this base file (used by Coolify) is PINNED to a specific release. Verify
# it's the current stable before deploying — https://glitchtip.com /
# https://gitlab.com/glitchtip. The local override (docker-compose.glitchtip.local.yml)
# floats all three services to :latest so local always runs the newest build.
# The worker/migrate entrypoints (bin/run-*.sh) are GlitchTip's documented ones.

x-glitchtip-image: &glitchtip-image glitchtip/glitchtip:v6.2

# Shared env for web + worker + migrate — they must agree.
x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD}@gt-postgres:5432/glitchtip
  REDIS_URL: redis://gt-redis:6379/0
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY}
  PORT: "8000"
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:?set GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
  # consolemail:// prints emails to the worker log (fine for testing). For real
  # invites in production set an SMTP URL, e.g. smtp://user:pass@host:587.
  EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
  # Keep registration CLOSED by default. The local override turns it on so you can
  # create the first account; in Coolify, set true once to register, then false.
  ENABLE_OPEN_USER_REGISTRATION: ${GLITCHTIP_OPEN_REGISTRATION:-false}
  CELERY_WORKER_AUTOSCALE: "1,3"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"

services:
  gt-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD}
      POSTGRES_DB: glitchtip
    volumes:
      - gt-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 10

  gt-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - gt-redis-data:/data

  # Runs DB migrations to completion, then exits. web/worker wait on nothing for
  # this, so on first boot give it a moment; it is idempotent on every deploy.
  gt-migrate:
    image: *glitchtip-image
    command: ./bin/run-migrate.sh
    restart: "no"
    depends_on:
      gt-postgres:
        condition: service_healthy
    environment: *glitchtip-env

  gt-web:
    image: *glitchtip-image
    restart: unless-stopped
    depends_on:
      gt-postgres:
        condition: service_healthy
      gt-redis:
        condition: service_started
    environment: *glitchtip-env
    # Exposed (not published) so Coolify's proxy routes the domain to it. The
    # local override adds a host port publish for http://localhost:8000.
    expose:
      - "8000"

  gt-worker:
    image: *glitchtip-image
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      gt-postgres:
        condition: service_healthy
      gt-redis:
        condition: service_started
    environment: *glitchtip-env

volumes:
  gt-pg-data:
  gt-redis-data:
