# Coolify develop deployment. Additive — does NOT replace docker-compose.yml
# (the local dev/AWS-adjacent stack). Deploy as a Coolify "Docker Compose"
# resource. In Coolify: expose `frontend` at dev.<domain> and `minio` port 9000
# at s3.dev.<domain>. See README "Deploying to Coolify (develop)".

# Single source of truth for the DB connection string. POSTGRES_PASSWORD is the
# only DB secret; the user and database names are fixed literals (`angelman`),
# matching the postgres service below. An anchor keeps the three DSNs from
# drifting apart — they must be identical.
x-database-url: &database-url postgres://angelman:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/angelman

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Selects the DevBanner variant. Defaults to dev-preview so the `dev`
        # resource is unchanged; the `next` resource sets next-preview. In
        # Coolify this MUST be marked a BUILD variable — Vite bakes it in at
        # build time, so a runtime variable silently does nothing.
        VITE_APP_ENV: ${VITE_APP_ENV:-dev-preview}
        # GlitchTip DSN for the browser SDK. Empty disables telemetry. MUST be a
        # BUILD variable in Coolify — Vite bakes it in at build time.
        VITE_GLITCHTIP_DSN: ${VITE_GLITCHTIP_DSN:-}
        # Privacy posture: "full" (next/dev, no real PII) or "scrubbed" (prod).
        # Defaults to scrubbed so an unset value fails private. BUILD variable.
        VITE_TELEMETRY_PRIVACY: ${VITE_TELEMETRY_PRIVACY:-scrubbed}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.coolify
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      LOCAL: "true"
      NODE_ENV: development
      PORT: "8080"
      # Under LOCAL=true both prisma.ts and prisma.config.ts read
      # LOCAL_DATABASE_URL; the other two are set identically as safe defaults.
      DATABASE_URL: *database-url
      LOCAL_DATABASE_URL: *database-url
      DIRECT_DATABASE_URL: *database-url
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      # Required secrets: an unset/empty value is a silent security hole
      # (e.g. an empty SEED_PASSWORD falls back to "password123" in the seed),
      # so fail the deploy fast rather than boot insecure.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required}
      INTERNAL_SECRET_HEADER: ${INTERNAL_SECRET_HEADER:?INTERNAL_SECRET_HEADER is required}
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD is required}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # SES_FROM_EMAIL intentionally unset -> log-only email.
      # GlitchTip telemetry (backend). Empty DSN disables it. Runtime vars.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      TELEMETRY_PRIVACY: ${TELEMETRY_PRIVACY:-scrubbed}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Fixed identifiers, NOT secrets. They are only applied on the volume's
      # FIRST init, so changing them later strands the existing database and
      # requires wiping postgres_data. They must stay in sync with the
      # x-database-url anchor above.
      POSTGRES_USER: angelman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: angelman
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "angelman"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # External URL so SigV4 host validation matches presigned URLs behind Traefik.
      MINIO_SERVER_URL: ${S3_ENDPOINT}
      # Allow browser cross-origin upload/stream from the app origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${ALLOWED_ORIGIN}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    # Inlined instead of a bind-mounted script. Coolify runs the compose from a
    # directory without the repo working tree, so a `./scripts/...` bind mount
    # resolves to a nonexistent host path and Docker creates an empty DIRECTORY
    # at the target ("Is a directory" when executed). Inlining removes the host
    # file dependency. `$$` escapes compose interpolation so the shell expands
    # the vars at runtime. Bucket stays private; CORS is on the MinIO server.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc alias set target "http://minio:9000" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          i=$$((i + 1))
          [ "$$i" -ge 30 ] && echo "[minio-init] MinIO not ready in time" && exit 1
          echo "[minio-init] waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing "target/$$S3_BUCKET_NAME"
        echo "[minio-init] done"
    restart: "no"

volumes:
  postgres_data:
  minio_data:
